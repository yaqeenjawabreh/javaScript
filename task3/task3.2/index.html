<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <select id="font-family">
            <option value="Times New Roman">Times New Roman</option>
            <option value="fantasy">fantasy</option>
        </select>

        <select id="font-size">
            <option value="10px">10px</option>
            <option value="15px">15px</option>
        </select>
       
        <input type="checkbox" id="bold" class="weight" value="bold">
         <label>bold</label>
        <input type="checkbox" id="italic" class="weight" value="italic">
         <label>italic</label>
        <input type="checkbox" id="underline" class="weight" value="underline">
         <label>underline</label><br><br>
         <textarea id="textarea" rows="10" cols="50">the quick brown fox over the lazy dog</textarea>
    </form>
    <script src="script.js"></script>
</body>
</html>
